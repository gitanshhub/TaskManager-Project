<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="dashboard-body neo-dashboard-body">
<main class="neo-shell">
    <aside class="neo-sidebar">
        <div class="neo-brand">
            <span class="neo-brand-mark">TF</span>
            <div>
                <h2>TaskManager</h2>
                <p>Workspace</p>
            </div>
        </div>

        <nav class="neo-nav">
            <button type="button" class="neo-nav-item active">Dashboard</button>
            <button type="button" class="neo-nav-item">Tasks</button>
            <button type="button" class="neo-nav-item">Settings</button>
        </nav>

        <div class="neo-session">
            <div class="neo-session-label">Signed in as</div>
            <strong id="currentUser">User</strong>
        </div>

        <div class="neo-sidebar-actions">
            <button id="loadTasksBtn" type="button" class="neo-sidebar-btn primary">Refresh</button>
            <button id="logoutBtn" type="button" class="neo-sidebar-btn">Logout</button>
        </div>
    </aside>

    <section class="neo-main">
        <header class="neo-header">
            <div>
                <h1>Dashboard</h1>
                <p>Manage visible tasks, update assignments, and keep work moving.</p>
            </div>
            <label class="neo-search">
                <span>Search</span>
                <input id="taskSearch" type="text" placeholder="Search tasks...">
            </label>
        </header>

        <section class="neo-stats">
            <article class="neo-stat-card">
                <p>Total Tasks</p>
                <h2 id="statVisibleTasks">0</h2>
            </article>
            <article class="neo-stat-card">
                <p>Created By You</p>
                <h2 id="statCreatedTasks">0</h2>
            </article>
            <article class="neo-stat-card">
                <p>Assigned To You</p>
                <h2 id="statAssignedTasks">0</h2>
            </article>
            <article class="neo-stat-card">
                <p>Overdue</p>
                <h2 id="statOverdueTasks">0</h2>
            </article>
        </section>

        <section class="neo-forms">
            <article class="neo-panel">
                <div class="neo-panel-head">
                    <div>
                        <span class="neo-panel-label">Create</span>
                        <h3>Create Task</h3>
                    </div>
                </div>
                <form id="createTaskForm" class="neo-form-grid">
                    <input id="createTitle" type="text" placeholder="Task title" required>
                    <input id="createDescription" type="text" placeholder="Description">
                    <select id="createPriority">
                        <option value="">Priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <input id="createDueDate" type="date">
                    <input id="createAssignedUsername" type="text" placeholder="Assign to username">
                    <button type="submit" class="neo-primary-btn">Add</button>
                </form>
            </article>

            <article class="neo-panel">
                <div class="neo-panel-head">
                    <div>
                        <span class="neo-panel-label">Update</span>
                        <h3>Edit Task</h3>
                    </div>
                    <button id="fetchTaskBtn" type="button" class="neo-secondary-btn">Load</button>
                </div>
                <form id="updateTaskForm" class="neo-form-grid">
                    <input id="updateTaskId" type="number" min="1" placeholder="Task ID" required>
                    <input id="updateTitle" type="text" placeholder="Task title" required>
                    <input id="updateDescription" type="text" placeholder="Description">
                    <select id="updatePriority">
                        <option value="">Priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <input id="updateDueDate" type="date">
                    <input id="updateAssignedUsername" type="text" placeholder="Assign to username">
                    <button type="submit" class="neo-primary-btn">Update</button>
                </form>
            </article>

            <article class="neo-panel neo-panel-delete">
                <div class="neo-panel-head">
                    <div>
                        <span class="neo-panel-label">Delete</span>
                        <h3>Remove Task</h3>
                    </div>
                </div>
                <form id="deleteTaskForm" class="neo-delete-form">
                    <input id="deleteTaskId" type="number" min="1" placeholder="Task ID to remove" required>
                    <button type="submit" class="neo-danger-btn">Delete</button>
                </form>
            </article>
        </section>

        <section class="neo-table-panel">
            <div class="neo-table-head">
                <div>
                    <span class="neo-panel-label">Task List</span>
                    <h3>Visible Tasks</h3>
                    <p id="taskCount" class="neo-table-copy">No tasks loaded yet.</p>
                </div>
                <div id="dashboardMessage" class="inline-message compact-message" aria-live="polite"></div>
            </div>

            <div id="results" class="neo-results"></div>
        </section>
    </section>
</main>

<script src="/app.js?v=4"></script>
</body>
</html>
